name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        django-version: ['5.0', '5.2', '6.0']
        exclude:
          # Django 6.0 requiere Python >= 3.12
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'
          # Django 5.0 soporta hasta Python 3.12
          - python-version: '3.13'
            django-version: '5.0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # UNA sola invocación de pip con el pin de Django incluido — en
        # invocaciones separadas el resolver puede upgradear Django
        # silenciosamente. DRF >= 3.16 requiere Django >= 5.1 → el combo
        # Django 5.0 acota DRF a < 3.16.
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.django-version }}" = "5.0" ]; then
            pip install -e ".[dev]" "Django~=5.0.0" "djangorestframework<3.16"
          else
            pip install -e ".[dev]" "Django~=${{ matrix.django-version }}.0" djangorestframework
          fi

      - name: Run tests
        run: python -m pytest -v
