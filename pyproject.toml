[project]
name = "sinpapel-drf"
version = "0.2.2"
description = "DRF HTTP layer for sinpapel — auto-routing, ViewSets, signature serializers (extraído desde creditos/E13)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Julio Adrián", email = "jadrian.s@gmail.com" },
]
keywords = ["django", "drf", "rest-framework", "workflow", "sinpapel", "fiel", "tramites"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sinpapel @ git+https://github.com/aprendomx/sinpapel.git@v0.5.1",
    "djangorestframework>=3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
]
openapi = [
    "drf-spectacular>=0.27",
]

[project.urls]
Homepage = "https://github.com/aprendomx/sinpapel-drf"
Source = "https://github.com/aprendomx/sinpapel-drf"
Issues = "https://github.com/aprendomx/sinpapel-drf/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Layout pyproject INSIDE-package (lección S12.8) — packages + package_dir explícitos
[tool.setuptools]
packages = ["sinpapel_drf"]

[tool.setuptools.package-dir]
sinpapel_drf = "."

[tool.pytest.ini_options]
addopts = "-m 'not install_smoke'"
markers = [
    "install_smoke: integration smoke tests requiring uv venv + pip install (skip by default; manual run via -m install_smoke)",
]
